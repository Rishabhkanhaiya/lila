<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lila Browser Copilot</title>
  <style>
    /* ── Reset & base ────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 280px;
      min-height: 140px;
      background: #0e0e12;
      color: #e2e2e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      padding: 20px 18px 18px;
      user-select: none;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #7b5ea7 0%, #4f8ef7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: #f0f0f6;
      letter-spacing: 0.01em;
    }

    /* ── Status rows ─────────────────────────────────────────────────── */
    .status-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #16161e;
      border: 1px solid #1e1e28;
      border-radius: 8px;
      padding: 9px 12px;
    }

    .status-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
    }

    .status-value {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #c8c8d4;
    }

    /* ── Indicator dot ───────────────────────────────────────────────── */
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      /* Default: disconnected / unknown */
      background: #444;
    }

    .dot.connected {
      background: #3dd68c;
      box-shadow: 0 0 6px rgba(61, 214, 140, 0.6);
    }

    .dot.disconnected {
      background: #e05a5a;
      box-shadow: 0 0 6px rgba(224, 90, 90, 0.5);
    }

    .dot.paired {
      background: #3dd68c;
      box-shadow: 0 0 6px rgba(61, 214, 140, 0.6);
    }

    .dot.unpaired {
      background: #f4a12a;
      box-shadow: 0 0 6px rgba(244, 161, 42, 0.5);
    }

    /* ── Footer ─────────────────────────────────────────────────────── */
    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #444;
      text-align: center;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">✦</div>
    <span class="title">Lila Browser Copilot</span>
  </div>

  <div class="status-group">
    <!-- Bridge connection status -->
    <div class="status-row">
      <span class="status-label">Bridge</span>
      <span class="status-value" id="connection-value">
        <span class="dot" id="connection-dot"></span>
        <span id="connection-text">Checking…</span>
      </span>
    </div>

    <!-- Pairing token status -->
    <div class="status-row">
      <span class="status-label">Pairing</span>
      <span class="status-value" id="pairing-value">
        <span class="dot" id="pairing-dot"></span>
        <span id="pairing-text">Checking…</span>
      </span>
    </div>
  </div>

  <p class="footer" id="footer-note">Lila v1 · local bridge ws://127.0.0.1:8765</p>

  <script src="popup.js"></script>
</body>
</html>
