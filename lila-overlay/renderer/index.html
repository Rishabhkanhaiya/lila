<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' blob: data: ws://127.0.0.1:*;">
  <title>Lila Desktop Companion</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/",
        "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
        "kalidokit": "../node_modules/kalidokit/dist/kalidokit.es.js"
      }
    }
  </script>
</head>
<body>

  <!-- Multi-Layer Lila Window Container per Specification -->
  <div id="companion-container" class="lila-window companion-window">

    <!-- Layer 0: Background Environment Image (assets/lila-environment.png) -->
    <div class="window-background"></div>

    <!-- Layer 1: Background Blur (frosted glass over environment image) -->
    <div class="window-background-blur"></div>

    <!-- Layer 2: Glass Overlay (translucent specular reflection) -->
    <div class="window-glass"></div>

    <!-- Layer 3: Subtle Ambient Lighting (dual radial gradients) -->
    <div class="window-light"></div>

    <!-- Layer 10: Actual UI & Character Content -->
    <div class="window-content">

      <!-- ── TOP HEADER (56px) ─────────────────────────────────── -->
      <header class="top-bar interactive" title="Drag to move Lila">
        <div class="top-bar-left">
          <div class="top-sparkle-wrap interactive" id="header-avatar-btn" title="Lila Desktop Companion (Click to switch model)">
            <svg viewBox="0 0 24 24" class="top-sparkle-svg">
              <path d="M12 1L14.4 8.6L22 11L14.4 13.4L12 21L9.6 13.4L2 11L9.6 8.6Z" fill="url(#sparkle-grad)" />
              <path d="M19 18L19.8 20.2L22 21L19.8 21.8L19 24L18.2 21.8L16 21L18.2 20.2Z" fill="url(#sparkle-grad)" opacity="0.85" />
              <defs>
                <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#E9D5FF"/>
                  <stop offset="50%" stop-color="#C084FC"/>
                  <stop offset="100%" stop-color="#5CC8FF"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="top-identity">
            <span class="top-name">Lila</span>
            <div class="top-status">
              <span class="status-dot-pulse" id="header-status-dot"></span>
              <span class="status-label" id="header-status-text">Online</span>
            </div>
          </div>
        </div>
        <div class="top-bar-controls">
          <button type="button" class="ctrl-btn btn-minimize interactive" id="btn-window-minimize" aria-label="Minimize" title="Minimize">
            <svg viewBox="0 0 24 24" class="ctrl-icon"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="ctrl-btn btn-pin interactive" id="btn-window-pin" aria-label="Pin on top / Mini mode" title="Pin / Mini Mode">
            <svg viewBox="0 0 24 24" class="ctrl-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="17" x2="12" y2="22"/>
              <path d="M5 17h14v-2l-3-3V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v7l-3 3v2z"/>
            </svg>
          </button>
          <button type="button" class="ctrl-btn btn-close interactive" id="btn-window-close" aria-label="Close" title="Close">
            <svg viewBox="0 0 24 24" class="ctrl-icon"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <!-- ── MAIN GRID (64px Navigation + Character Area) ───────── -->
      <div class="main-grid">

        <!-- Left Navigation Rail (Matching Image 2: Minimalist Icon Column) -->
        <nav class="window-navigation side-rail interactive" aria-label="Navigation">
          <button type="button" class="rail-item rail-home active interactive" data-page="home" title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24" class="rail-icon home-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </button>
          <button type="button" class="rail-item interactive" data-page="chat" title="Chat" aria-label="Chat">
            <svg viewBox="0 0 24 24" class="rail-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button type="button" class="rail-item interactive" data-page="voice" title="Voice" aria-label="Voice">
            <svg viewBox="0 0 24 24" class="rail-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          </button>
          <button type="button" class="rail-item interactive" data-page="settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" class="rail-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <div class="rail-spacer"></div>
          <button type="button" class="rail-item rail-more interactive" data-page="more" title="More Options" aria-label="More Options">
            <svg viewBox="0 0 24 24" class="rail-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></svg>
          </button>
        </nav>

        <!-- Main Character Area (Hero element) -->
        <main class="main-character-area character-area">

          <!-- Ambient glow behind Lila -->
          <div class="lila-ambient avatar-ambient-glow"></div>

          <!-- Floating Quick Action Pills (Image 2 exact match) -->
          <div class="floating-pills-column interactive">
            <button type="button" class="floating-pill active interactive" data-action="chat" title="Chat with Lila">
              <svg viewBox="0 0 24 24" class="pill-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              <span class="pill-text">Chat</span>
            </button>
            <button type="button" class="floating-pill interactive" data-action="voice" title="Voice Mode">
              <svg viewBox="0 0 24 24" class="pill-icon icon-voice" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
              </svg>
              <span class="pill-text">Voice</span>
            </button>
            <button type="button" class="floating-pill interactive" data-action="settings" title="Settings">
              <svg viewBox="0 0 24 24" class="pill-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <span class="pill-text">Settings</span>
            </button>
            <button type="button" class="floating-pill interactive" data-action="memory" title="Memories">
              <svg viewBox="0 0 24 24" class="pill-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.5 2A4.5 4.5 0 0 0 5 6.5c0 .41.06.8.16 1.18A4 4 0 0 0 3 11.5a4 4 0 0 0 1.25 2.92A4.5 4.5 0 0 0 4 16.5 4.5 4.5 0 0 0 8.5 21c.5 0 .97-.08 1.41-.23A4 4 0 0 0 12 22a4 4 0 0 0 2.09-1.23c.44.15.91.23 1.41.23a4.5 4.5 0 0 0 4.5-4.5c0-.75-.18-1.46-.5-2.08A4 4 0 0 0 21 11.5a4 4 0 0 0-2.16-3.82c.1-.38.16-.77.16-1.18A4.5 4.5 0 0 0 14.5 2c-1.33 0-2.52.58-3.33 1.5A4.48 4.48 0 0 0 9.5 2z"/>
                <path d="M12 4v16"/>
              </svg>
              <span class="pill-text">Memories</span>
            </button>
            <button type="button" class="floating-pill interactive" data-action="more" title="More Options">
              <svg viewBox="0 0 24 24" class="pill-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="1.5"/>
                <circle cx="19" cy="12" r="1.5"/>
                <circle cx="5" cy="12" r="1.5"/>
              </svg>
              <span class="pill-text">More</span>
            </button>
          </div>

          <!-- Greeting block — floating naturally without card or border (Image 2) -->
          <div id="speech-bubble" class="window-greeting greeting-block interactive" title="Drag to move Lila">
            <div class="greeting-hey">Hey! <span class="heart-symbol">♡</span></div>
            <div id="bubble-caption" class="greeting-caption">How can I<br>help you today?</div>
            <div id="mood-badge" style="display: none;">Idle</div>
          </div>

          <!-- 3D Avatar Viewport -->
          <div id="hud-viewport" class="lila-character hud-viewport interactive" title="Double-click to switch avatar / Drag to move">
            <div id="three-container"></div>
            <canvas id="hud-canvas" width="440" height="440" style="display: none;"></canvas>
          </div>

          <!-- Soundwave visualizer (active only during speech) -->
          <div class="audio-soundwave" id="audio-soundwave" style="display: none;">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
          </div>

          <!-- ── FLOATING GLASS INPUT CAPSULE ──────────────────────── -->
          <div id="chat-drawer" class="lila-input input-dock interactive">
            <!-- Lila Avatar Badge (38px circular with golden ring) -->
            <div class="input-avatar-wrap dock-avatar-btn interactive" id="lila-logo-badge" title="Lila (Click to switch outfit/avatar)">
              <img src="../assets/lila_logo.png" class="input-avatar dock-avatar-img" alt="Lila" />
              <span class="dock-avatar-dot" id="logo-status-dot"></span>
            </div>

            <!-- Microphone Button (36px circular, cyan accent) -->
            <button type="button" id="btn-mic-mute" class="input-mic dock-circle-btn dock-mic-btn interactive" title="Mute / Unmute Microphone" aria-label="Toggle Mic Mute">
              <svg viewBox="0 0 24 24" class="dock-btn-icon mic-active-svg" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
              </svg>
              <svg viewBox="0 0 24 24" class="dock-btn-icon mic-muted-svg" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <line x1="2" y1="2" x2="22" y2="22"/>
                <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/>
                <path d="M5 10v2a7 7 0 0 0 12 5"/>
                <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/>
                <path d="M9 9v3a3 3 0 0 0 5.12 2.12"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
              </svg>
            </button>

            <!-- Audio / Headphone Profile Button (36px circular, lavender accent) -->
            <button type="button" id="btn-audio-device" class="input-headphone dock-circle-btn dock-audio-btn interactive profile-rockerz" title="Audio Hardware Settings" aria-label="Switch Audio Profile">
              <svg viewBox="0 0 24 24" class="dock-btn-icon audio-dev-icon icon-rockerz" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
              </svg>
            </button>

            <!-- Transparent Command Input Field -->
            <input
              type="text"
              id="chat-input"
              class="input-text dock-text-input interactive"
              placeholder="Ask Lila anything..."
              autocomplete="off"
              spellcheck="false"
            />

            <!-- Send Button (42px circular, purple gradient with solid paper airplane) -->
            <button type="button" id="btn-send-chat" class="input-send dock-send-btn interactive" aria-label="Send message" title="Send message">
              <svg viewBox="0 0 24 24" class="send-plane-svg" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
            </button>
          </div>

        </main>
      </div>

    </div>

    <!-- ── LEGACY HIDDEN ACTION BUTTONS (compatibility) ──────────── -->
    <div id="quick-actions" style="display: none;">
      <button id="btn-mute" type="button"></button>
      <button id="btn-memory" type="button"></button>
      <button id="btn-screenshot" type="button"></button>
      <button id="btn-chat" type="button"></button>
    </div>

    <!-- ── AUDIO HARDWARE MODAL ───────────────────────────────────── -->
    <div id="audio-settings-modal" class="audio-modal interactive">
      <div class="audio-modal-header">
        <div class="audio-modal-title">
          <svg viewBox="0 0 24 24" class="title-icon" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          <span>Audio Hardware</span>
        </div>
        <button type="button" id="btn-close-audio-modal" class="modal-close-btn interactive" aria-label="Close">✕</button>
      </div>

      <div class="audio-modal-body">
        <div class="device-group">
          <label class="device-label" for="select-output-device">
            <span>Output Device (Speaker / Headset)</span>
          </label>
          <div class="select-wrapper">
            <select id="select-output-device" class="device-select interactive">
              <option value="" disabled selected>Scanning output devices...</option>
            </select>
          </div>
        </div>

        <div class="device-group">
          <label class="device-label" for="select-input-device">
            <span>Input Device (Microphone)</span>
          </label>
          <div class="select-wrapper">
            <select id="select-input-device" class="device-select interactive">
              <option value="" disabled selected>Scanning input devices...</option>
            </select>
          </div>
          <div class="mic-level-container">
            <span class="mic-level-label">Mic Activity:</span>
            <div class="mic-level-bar-bg">
              <div id="mic-level-bar" class="mic-level-bar-fill"></div>
            </div>
          </div>
        </div>

        <div class="audio-modal-footer">
          <button type="button" id="btn-refresh-devices" class="audio-action-btn secondary interactive">
            🔄 Refresh
          </button>
          <button type="button" id="btn-test-sound" class="audio-action-btn primary interactive">
            🔊 Test Output
          </button>
        </div>
      </div>
    </div>

    <!-- ── REALTIME UI TRAY ───────────────────────────────────────── -->
    <div id="realtime-ui-tray" class="realtime-ui-tray interactive" style="display: none;">
      <div class="ui-tray-header">
        <div class="ui-tray-title-group">
          <span id="ui-tray-icon" class="ui-tray-icon">🎵</span>
          <div class="ui-tray-text">
            <span id="ui-tray-title" class="ui-tray-title">Lila Assistant</span>
            <span id="ui-tray-subtitle" class="ui-tray-subtitle">Tap or speak your choice</span>
          </div>
        </div>
        <button type="button" id="btn-close-ui-tray" class="ui-tray-close-btn interactive" aria-label="Close">✕</button>
      </div>
      <div id="ui-category-pills" class="ui-category-pills interactive"></div>
      <div id="ui-cards-container" class="ui-cards-container interactive"></div>
      <div class="ui-timer-bar">
        <div id="ui-timer-progress" class="ui-timer-progress"></div>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
