<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' blob: data: ws://127.0.0.1:*;">
  <title>Lila Companion</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/",
        "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
        "kalidokit": "../node_modules/kalidokit/dist/kalidokit.es.js"
      }
    }
  </script>
</head>
<body>

  <div id="companion-container">

    <!-- Fading Glassmorphism Speech Bubble -->
    <div id="speech-bubble" class="interactive">
      <div class="bubble-header">
        <div class="lila-badge">Lila</div>
        <div id="mood-badge" class="mood-badge">Excited</div>
      </div>
      <div id="bubble-caption" class="bubble-caption">
        Connecting to Lila... ✨
      </div>
    </div>

    <!-- Lila Core HUD Viewport (Click/drag to move, double-click to toggle 3D avatar) -->
    <div id="hud-viewport" class="interactive" title="Double-click to toggle 3D / 2D mode">
      <div id="three-container"></div>
      <canvas id="hud-canvas" width="400" height="400"></canvas>
    </div>

    <!-- Hover-Triggered Radial Quick Action Bar -->
    <div id="quick-actions">
      <!-- 1. Mute Action -->
      <button id="btn-mute" class="action-btn interactive" data-tooltip="Mute Speech" aria-label="Mute">
        <svg viewBox="0 0 24 24">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>

      <!-- 2. Memory Reset / Context Fresh -->
      <button id="btn-memory" class="action-btn interactive" data-tooltip="Refresh Memory" aria-label="Memory">
        <svg viewBox="0 0 24 24">
          <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.59 10.56 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm-1-9h2v4h-2zm0 6h2v2h-2z"/>
        </svg>
      </button>

      <!-- 3. Screen Snapshot & Vision Analysis -->
      <button id="btn-screenshot" class="action-btn interactive" data-tooltip="Look at Screen" aria-label="Screenshot">
        <svg viewBox="0 0 24 24">
          <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
          <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
        </svg>
      </button>

      <!-- 4. Open Chat / Focus Window -->
      <button id="btn-chat" class="action-btn interactive" data-tooltip="Chat With Lila" aria-label="Chat">
        <svg viewBox="0 0 24 24">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
        </svg>
      </button>
    </div>

    <!-- Audio Hardware & Devices Settings Modal -->
    <div id="audio-settings-modal" class="audio-modal interactive">
      <div class="audio-modal-header">
        <div class="audio-modal-title">
          <svg viewBox="0 0 24 24" class="title-icon">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
          <span>Audio Hardware</span>
        </div>
        <button type="button" id="btn-close-audio-modal" class="modal-close-btn interactive" aria-label="Close">✕</button>
      </div>

      <div class="audio-modal-body">
        <!-- Output Device Section -->
        <div class="device-group">
          <label class="device-label" for="select-output-device">
            <svg viewBox="0 0 24 24" class="field-icon">
              <path d="M12 1a9 9 0 0 0-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2a7 7 0 0 1 14 0v2h-4v8h3c1.66 0 3-1.34 3-3v-7a9 9 0 0 0-9-9z"/>
            </svg>
            <span>Output Device (Speaker / Headset)</span>
          </label>
          <div class="select-wrapper">
            <select id="select-output-device" class="device-select interactive">
              <option value="" disabled selected>Scanning output devices...</option>
            </select>
          </div>
        </div>

        <!-- Input Device Section -->
        <div class="device-group">
          <label class="device-label" for="select-input-device">
            <svg viewBox="0 0 24 24" class="field-icon">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
            <span>Input Device (Microphone)</span>
          </label>
          <div class="select-wrapper">
            <select id="select-input-device" class="device-select interactive">
              <option value="" disabled selected>Scanning input devices...</option>
            </select>
          </div>
          <!-- Live Mic VU Meter -->
          <div class="mic-level-container">
            <span class="mic-level-label">Mic Activity:</span>
            <div class="mic-level-bar-bg">
              <div id="mic-level-bar" class="mic-level-bar-fill"></div>
            </div>
          </div>
        </div>

        <div class="audio-modal-footer">
          <button type="button" id="btn-refresh-devices" class="audio-action-btn secondary interactive">
            🔄 Refresh
          </button>
          <button type="button" id="btn-test-sound" class="audio-action-btn primary interactive">
            🔊 Test Output
          </button>
        </div>
      </div>
    </div>

    <!-- Realtime Interactive Multimodal UI Tray (Show, Don't Recite) -->
    <div id="realtime-ui-tray" class="realtime-ui-tray interactive" style="display: none;">
      <div class="ui-tray-header">
        <div class="ui-tray-title-group">
          <span id="ui-tray-icon" class="ui-tray-icon">🎵</span>
          <div class="ui-tray-text">
            <span id="ui-tray-title" class="ui-tray-title">Choose Music Vibe</span>
            <span id="ui-tray-subtitle" class="ui-tray-subtitle">Tap an option or just speak your choice</span>
          </div>
        </div>
        <button type="button" id="btn-close-ui-tray" class="ui-tray-close-btn interactive" aria-label="Close">✕</button>
      </div>

      <!-- Category Filter Pills Bar (e.g. Romance, Party, Chill, Drive, Workout) -->
      <div id="ui-category-pills" class="ui-category-pills interactive"></div>

      <!-- Dynamic Cards List Container (Scrollable) -->
      <div id="ui-cards-container" class="ui-cards-container interactive"></div>

      <!-- Subtle Progress / Auto-Dismiss Timer Line -->
      <div class="ui-timer-bar">
        <div id="ui-timer-progress" class="ui-timer-progress"></div>
      </div>
    </div>

    <!-- Interactive Futuristic Companion Command Dock -->
    <div id="chat-drawer" class="chat-drawer interactive">
      <div class="chat-input-wrapper">
        <!-- Lila App Official Brand Logo Badge -->
        <div class="chat-ai-badge interactive" id="lila-logo-badge" title="Lila Desktop Companion">
          <img src="../assets/lila_logo.png" class="lila-logo-img" alt="Lila" />
          <span class="ai-pulse-dot" id="logo-status-dot"></span>
        </div>

        <!-- Dedicated Microphone Mute / Unmute Button -->
        <button type="button" id="btn-mic-mute" class="mic-toggle-btn interactive" title="Mute Microphone (Currently Active)" aria-label="Toggle Mic Mute">
          <!-- Active Mic Icon -->
          <svg viewBox="0 0 24 24" class="mic-icon mic-active-svg">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <!-- Muted Mic Icon (With Diagonal Slash) -->
          <svg viewBox="0 0 24 24" class="mic-icon mic-muted-svg" style="display: none;">
            <path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c1.68-.24 3.2-.95 4.34-1.99l2.39 2.39 1.27-1.27L4.27 3z"/>
          </svg>
        </button>

        <!-- Audio Device Profile Switcher (1. PC Speakers / 2. Rockerz Headset / 3. Earbuds Any) -->
        <button type="button" id="btn-audio-device" class="audio-toggle-btn interactive profile-rockerz" title="Audio: boAt Rockerz Headset (Click to switch)" aria-label="Switch Audio Device">
          <!-- Icon 1: PC / Laptop Speakers -->
          <svg viewBox="0 0 24 24" class="audio-dev-icon icon-pc" style="display: none;">
            <path d="M20 18c1.1 0 1.99-.9 1.99-2L22 5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2H0c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2h-4zM4 5h16v11H4V5zm8 14c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
          </svg>
          <!-- Icon 2: boAt Rockerz Headset (Default) -->
          <svg viewBox="0 0 24 24" class="audio-dev-icon icon-rockerz">
            <path d="M12 1a9 9 0 0 0-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2a7 7 0 0 1 14 0v2h-4v8h3c1.66 0 3-1.34 3-3v-7a9 9 0 0 0-9-9z"/>
          </svg>
          <!-- Icon 3: Wireless Earbuds (Any) -->
          <svg viewBox="0 0 24 24" class="audio-dev-icon icon-earbuds" style="display: none;">
            <path d="M8 3a3 3 0 0 0-3 3v5a3 3 0 0 0 3 3c.37 0 .72-.07 1.04-.2A3.99 3.99 0 0 0 11 17.75V21h2v-7a4 4 0 0 0-4-4V6a1 1 0 0 1 2 0v2h2V6a3 3 0 0 0-3-3zm8 0a3 3 0 0 0-3 3v2h2V6a1 1 0 0 1 2 0v4a4 4 0 0 0-4 4v7h2v-3.25c.96-.54 1.46-1.46 1.96-2.55.32.13.67.2 1.04.2a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"/>
          </svg>
        </button>

        <input 
          type="text" 
          id="chat-input" 
          placeholder="Ask Lila anything or type /... ✨" 
          autocomplete="off" 
          spellcheck="false" 
        />

        <!-- Ultra-Sleek Modern Send Button -->
        <button type="button" id="btn-send-chat" class="interactive" aria-label="Send">
          <svg viewBox="0 0 24 24" class="send-arrow-svg">
            <path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
