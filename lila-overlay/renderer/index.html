<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' blob: data: ws://127.0.0.1:*;">
  <title>Lila Companion</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/",
        "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
        "kalidokit": "../node_modules/kalidokit/dist/kalidokit.es.js"
      }
    }
  </script>
</head>
<body>

  <!-- Main Companion Window -->
  <div id="companion-container" class="companion-window">

    <!-- ── TOP BAR ─────────────────────────────────────────────── -->
    <div class="top-bar interactive" title="Drag to move Lila">
      <div class="top-bar-left">
        <div class="top-logo">✦</div>
        <div class="top-identity">
          <span class="top-name">Lila</span>
          <div class="top-status">
            <span class="status-dot-pulse" id="header-status-dot"></span>
            <span class="status-label" id="header-status-text">Online</span>
          </div>
        </div>
      </div>
      <div class="top-bar-controls">
        <button type="button" class="ctrl-btn btn-minimize interactive" id="btn-window-minimize" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 12 12" class="ctrl-icon"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="ctrl-btn btn-pin interactive" id="btn-window-pin" aria-label="Pin on top" title="Pin on Top">
          <svg viewBox="0 0 12 12" class="ctrl-icon"><path d="M6 2v5M4 9h4M6 7l-2.5 2.5M6 7l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="ctrl-btn btn-close interactive" id="btn-window-close" aria-label="Close" title="Close">
          <svg viewBox="0 0 12 12" class="ctrl-icon"><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <!-- ── MAIN CONTENT ──────────────────────────────────────────── -->
    <div class="main-content">

      <!-- Left Navigation Rail -->
      <nav class="side-rail interactive">
        <button type="button" class="rail-item active interactive" data-page="home" title="Home" aria-label="Home">
          <svg viewBox="0 0 24 24" class="rail-icon" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>
        <button type="button" class="rail-item interactive" data-page="chat" title="Chat" aria-label="Chat">
          <svg viewBox="0 0 24 24" class="rail-icon" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </button>
        <button type="button" class="rail-item interactive" data-page="voice" title="Voice" aria-label="Voice">
          <svg viewBox="0 0 24 24" class="rail-icon" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08C16.39 17.43 19 14.53 19 11h-2z"/></svg>
        </button>
        <button type="button" class="rail-item interactive" data-page="settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" class="rail-icon" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        </button>
        <div class="rail-spacer"></div>
        <button type="button" class="rail-item rail-more interactive" data-page="more" title="More Options" aria-label="More Options">
          <svg viewBox="0 0 24 24" class="rail-icon" fill="currentColor"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
      </nav>

      <!-- Character + Greeting Area -->
      <div class="character-area">

        <!-- Atmospheric glow behind avatar (warm + cool dual ambient lighting) -->
        <div class="avatar-glow"></div>
        <div class="warm-room-glow"></div>

        <!-- Floating Quick Action Pills (matching reference image) -->
        <div class="home-quick-actions interactive" id="home-quick-actions">
          <button type="button" class="quick-action-pill active interactive" data-action="chat" title="Chat with Lila">
            <span class="pill-icon">💬</span>
            <span class="pill-text">Chat</span>
          </button>
          <button type="button" class="quick-action-pill interactive" data-action="voice" title="Voice Conversation">
            <span class="pill-icon">🎤</span>
            <span class="pill-text">Voice</span>
          </button>
          <button type="button" class="quick-action-pill interactive" data-action="settings" title="Audio & Devices">
            <span class="pill-icon">⚙</span>
            <span class="pill-text">Settings</span>
          </button>
          <button type="button" class="quick-action-pill interactive" data-action="memories" title="Lila's Memories">
            <span class="pill-icon">🧠</span>
            <span class="pill-text">Memories</span>
          </button>
          <button type="button" class="quick-action-pill interactive" data-action="more" title="More Features">
            <span class="pill-icon">•••</span>
            <span class="pill-text">More</span>
          </button>
        </div>

        <!-- Greeting block — top right of character area -->
        <div id="speech-bubble" class="greeting-block interactive" title="Drag to move Lila">
          <div class="greeting-hey">Hey! <span class="heart-symbol">♡</span></div>
          <div id="bubble-caption" class="greeting-caption">How can I<br>help you today?</div>
          <div id="mood-badge" style="display: none;">Idle</div>
        </div>

        <!-- Soundwave visualizer (subtle, active when speaking) -->
        <div class="audio-soundwave" id="audio-soundwave" style="display: none;">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>

        <!-- 3D Avatar Viewport -->
        <div id="hud-viewport" class="hud-viewport interactive" title="Drag to move Lila">
          <div id="three-container"></div>
          <canvas id="hud-canvas" width="440" height="440" style="display: none;"></canvas>
        </div>

      </div>
    </div>

    <!-- ── BOTTOM INPUT DOCK ──────────────────────────────────────── -->
    <div id="chat-drawer" class="input-dock interactive">
      <div class="dock-inner">

        <!-- Lila Avatar Badge -->
        <div class="dock-avatar-btn interactive" id="lila-logo-badge" title="Lila (Click to change outfit/avatar)">
          <img src="../assets/lila_logo.png" class="dock-avatar-img" alt="Lila" />
          <span class="dock-avatar-dot" id="logo-status-dot"></span>
        </div>

        <!-- Mic Button -->
        <button type="button" id="btn-mic-mute" class="dock-circle-btn dock-mic-btn interactive" title="Mute / Unmute Microphone" aria-label="Toggle Mic Mute">
          <svg viewBox="0 0 24 24" class="dock-btn-icon mic-active-svg">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <svg viewBox="0 0 24 24" class="dock-btn-icon mic-muted-svg" style="display: none;">
            <path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c1.68-.24 3.2-.95 4.34-1.99l2.39 2.39 1.27-1.27L4.27 3z"/>
          </svg>
        </button>

        <!-- Audio / Headphone Button -->
        <button type="button" id="btn-audio-device" class="dock-circle-btn dock-audio-btn interactive profile-rockerz" title="Audio Settings" aria-label="Switch Audio Profile">
          <svg viewBox="0 0 24 24" class="dock-btn-icon audio-dev-icon icon-pc" style="display: none;">
            <path d="M20 18c1.1 0 1.99-.9 1.99-2L22 5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2H0c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2h-4zM4 5h16v11H4V5zm8 14c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
          </svg>
          <svg viewBox="0 0 24 24" class="dock-btn-icon audio-dev-icon icon-rockerz">
            <path d="M12 1a9 9 0 0 0-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2a7 7 0 0 1 14 0v2h-4v8h3c1.66 0 3-1.34 3-3v-7a9 9 0 0 0-9-9z"/>
          </svg>
          <svg viewBox="0 0 24 24" class="dock-btn-icon audio-dev-icon icon-earbuds" style="display: none;">
            <path d="M8 3a3 3 0 0 0-3 3v5a3 3 0 0 0 3 3c.37 0 .72-.07 1.04-.2A3.99 3.99 0 0 0 11 17.75V21h2v-7a4 4 0 0 0-4-4V6a1 1 0 0 1 2 0v2h2V6a3 3 0 0 0-3-3zm8 0a3 3 0 0 0-3 3v2h2V6a1 1 0 0 1 2 0v4a4 4 0 0 0-4 4v7h2v-3.25c.96-.54 1.46-1.46 1.96-2.55.32.13.67.2 1.04.2a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"/>
          </svg>
        </button>

        <!-- Text Input -->
        <input
          type="text"
          id="chat-input"
          class="dock-text-input interactive"
          placeholder="Ask Lila anything..."
          autocomplete="off"
          spellcheck="false"
        />

        <!-- Send Button -->
        <button type="button" id="btn-send-chat" class="dock-send-btn interactive" aria-label="Send">
          <svg viewBox="0 0 24 24" class="send-plane-svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>

      </div>
    </div>

    <!-- ── LEGACY HIDDEN BUTTONS (compatibility) ─────────────────── -->
    <div id="quick-actions" style="display: none;">
      <button id="btn-mute" type="button"></button>
      <button id="btn-memory" type="button"></button>
      <button id="btn-screenshot" type="button"></button>
      <button id="btn-chat" type="button"></button>
    </div>

    <!-- ── AUDIO HARDWARE MODAL ───────────────────────────────────── -->
    <div id="audio-settings-modal" class="audio-modal interactive">
      <div class="audio-modal-header">
        <div class="audio-modal-title">
          <svg viewBox="0 0 24 24" class="title-icon">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
          <span>Audio Hardware</span>
        </div>
        <button type="button" id="btn-close-audio-modal" class="modal-close-btn interactive" aria-label="Close">✕</button>
      </div>

      <div class="audio-modal-body">
        <div class="device-group">
          <label class="device-label" for="select-output-device">
            <span>Output Device (Speaker / Headset)</span>
          </label>
          <div class="select-wrapper">
            <select id="select-output-device" class="device-select interactive">
              <option value="" disabled selected>Scanning output devices...</option>
            </select>
          </div>
        </div>

        <div class="device-group">
          <label class="device-label" for="select-input-device">
            <span>Input Device (Microphone)</span>
          </label>
          <div class="select-wrapper">
            <select id="select-input-device" class="device-select interactive">
              <option value="" disabled selected>Scanning input devices...</option>
            </select>
          </div>
          <div class="mic-level-container">
            <span class="mic-level-label">Mic Activity:</span>
            <div class="mic-level-bar-bg">
              <div id="mic-level-bar" class="mic-level-bar-fill"></div>
            </div>
          </div>
        </div>

        <div class="audio-modal-footer">
          <button type="button" id="btn-refresh-devices" class="audio-action-btn secondary interactive">
            🔄 Refresh
          </button>
          <button type="button" id="btn-test-sound" class="audio-action-btn primary interactive">
            🔊 Test Output
          </button>
        </div>
      </div>
    </div>

    <!-- ── REALTIME UI TRAY ───────────────────────────────────────── -->
    <div id="realtime-ui-tray" class="realtime-ui-tray interactive" style="display: none;">
      <div class="ui-tray-header">
        <div class="ui-tray-title-group">
          <span id="ui-tray-icon" class="ui-tray-icon">🎵</span>
          <div class="ui-tray-text">
            <span id="ui-tray-title" class="ui-tray-title">Lila Assistant</span>
            <span id="ui-tray-subtitle" class="ui-tray-subtitle">Tap or speak your choice</span>
          </div>
        </div>
        <button type="button" id="btn-close-ui-tray" class="ui-tray-close-btn interactive" aria-label="Close">✕</button>
      </div>
      <div id="ui-category-pills" class="ui-category-pills interactive"></div>
      <div id="ui-cards-container" class="ui-cards-container interactive"></div>
      <div class="ui-timer-bar">
        <div id="ui-timer-progress" class="ui-timer-progress"></div>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
